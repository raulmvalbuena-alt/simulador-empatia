<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<!-- Página de prueba V2 (cara realista con Simli). Aparte de la app: no cambia nada de lo que ya funciona. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob: data: mediastream:; connect-src 'self' https: wss:; worker-src 'self' blob:; base-uri 'none'; form-action 'none'; object-src 'none'">
<title>Prueba · cara realista</title>
<style>
  :root { --bg: #f4f6f8; --surface: #fff; --ink: #1d2733; --muted: #5d6b7a; --line: #dfe5eb; --accent: #0f766e; --warn: #b45309; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 16px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); }
  main { max-width: 560px; margin: 0 auto; padding: 16px 16px calc(24px + env(safe-area-inset-bottom)); }
  h1 { font-size: 1.15rem; margin: 4px 0 2px; }
  .sub { color: var(--muted); font-size: .9rem; margin: 0 0 12px; }
  .stage { position: relative; background: #0b1117; border-radius: 16px; overflow: hidden; aspect-ratio: 1 / 1; }
  video { width: 100%; height: 100%; object-fit: cover; display: block; }
  .ph { position: absolute; inset: 0; display: grid; place-items: center; color: #9fb0c0; text-align: center; padding: 24px; font-size: .95rem; }
  .ring { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,.55); color: #fff; border-radius: 999px; padding: 4px 10px; font-size: .8rem; }
  .status { margin: 10px 0 4px; font-weight: 600; }
  .caption { min-height: 2.6em; color: var(--ink); }
  .mine { color: var(--muted); font-size: .9rem; min-height: 1.3em; }
  .row { display: flex; gap: 8px; margin-top: 10px; }
  input[type=text] { flex: 1; min-width: 0; padding: 12px; border: 1px solid var(--line); border-radius: 12px; font: inherit; background: var(--surface); }
  button { padding: 12px 16px; border: 0; border-radius: 12px; font: inherit; font-weight: 600; background: var(--accent); color: #fff; }
  button.sec { background: var(--surface); color: var(--ink); border: 1px solid var(--line); }
  button:disabled { opacity: .5; }
  .mic.rec { background: #b91c1c; }
  .times { margin-top: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; font-size: .88rem; color: var(--muted); }
  .times b { color: var(--ink); }
  .err { color: var(--warn); font-size: .9rem; margin-top: 8px; }
  details { margin-top: 12px; font-size: .88rem; color: var(--muted); }
  details input { width: 100%; margin-top: 6px; }
  a { color: var(--accent); }
</style>
</head>
<body>
<main>
  <h1>Prueba · cara realista (V2)</h1>
  <p class="sub">Caso «Seis horas en el box» con Javier. Solo para Docencia. No guarda sesión ni informe.</p>

  <div class="stage">
    <video id="video" autoplay playsinline muted></video>
    <div class="ph" id="ph">Pulsa «Conectar» para que aparezca la cara.</div>
    <div class="ring" id="ring">Emoción 7/10</div>
  </div>
  <audio id="audio" autoplay playsinline></audio>

  <div class="status" id="status">Comprobando tu sesión…</div>
  <div class="caption" id="caption"></div>
  <div class="mine" id="mine"></div>

  <div class="row">
    <button id="connect" disabled>Conectar</button>
    <button id="hang" class="sec" disabled>Colgar</button>
  </div>
  <div class="row">
    <input id="input" type="text" placeholder="Escribe lo que le dices a Javier…" disabled>
    <button id="send" disabled>Enviar</button>
    <button id="mic" class="mic" disabled aria-label="Hablar">🎙</button>
  </div>

  <div class="times" id="times">Aquí verás cuánto tarda cada turno.</div>
  <div class="err" id="err"></div>

  <details>
    <summary>Opciones de la prueba</summary>
    <label>ID de cara de Simli (vacío = la cara por defecto)
      <input id="face" type="text" placeholder="p. ej. 14c60d62-6ebf-424d-b626-1f4f91c33b04">
    </label>
  </details>
  <p class="sub" style="margin-top:14px"><a href="./">Volver a la app</a></p>
</main>
<script src="vendor/supabase.js" integrity="sha384-0w2KAL2YHP6wKOkUDzkCDGgVvfmHnj02DHeQ6XcHOgTfFsGyonKOpShMH1x6nk9o"></script>
<script type="module" src="prueba-cara.js"></script>
</body>
</html>
